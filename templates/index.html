<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Board</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f5f9;
      color: #1c2333;
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .subtitle { margin: 0 0 24px; color: #5b6478; }
    form, .note {
      background: #ffffff;
      border: 1px solid #dde2ee;
      border-radius: 10px;
      padding: 16px;
    }
    form { display: grid; gap: 10px; margin-bottom: 24px; }
    input, textarea, button { font: inherit; padding: 10px; border-radius: 8px; }
    input, textarea { border: 1px solid #c3cadb; width: 100%; }
    button {
      border: 0;
      background: #2f6df6;
      color: #ffffff;
      cursor: pointer;
    }
    button:hover { background: #1f57d1; }
    .note { margin-bottom: 10px; }
    .note p { margin: 0 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .meta { color: #5b6478; font-size: 0.85rem; }
    .empty { color: #5b6478; text-align: center; padding: 24px 0; }
    footer { margin-top: 32px; text-align: center; color: #5b6478; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Notes Board</h1>
    <p class="subtitle">A two-tier app: flask web tier, MySQL databse tier deployed by Jenkins on Azure.</p>

    <form method="post" action="{{ url_for('add_note') }}">
      <input type="text" name="author" placeholder="Your name" maxlength="50" required>
      <textarea name="content" rows="3" placeholder="Write a note..." maxlength="500" required></textarea>
      <button type="submit">Post note</button>
    </form>

    {% for note in notes %}
      <div class="note">
        <p>{{ note.content }}</p>
        <span class="meta">{{ note.author }} &middot; {{ note.created_at.strftime('%d %b %Y, %H:%M') }} UTC</span>
      </div>
    {% else %}
      <p class="empty">No notes yet. Post the first one above.</p>
    {% endfor %}

    <footer>Build {{ version }}</footer>
  </main>
</body>
</html>
